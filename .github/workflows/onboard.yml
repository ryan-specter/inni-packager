name: Onboard and watch y1-community firmware mirrors

# GitHub does not deliver a release event from a source repository to this
# repository.  Poll frequently instead, then dispatch only the affected mirror
# workflows.  The mirror repositories keep their own hourly schedule as a
# fallback if this watcher is delayed or disabled.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "Create missing repositories and seed files"
        required: false
        type: boolean
        default: false
      trigger:
        description: "Dispatch every selected mirror workflow (manual full rebuild)"
        required: false
        type: boolean
        default: false
      trigger_changed:
        description: "Dispatch only mirrors whose source, seed or manifest changed"
        required: false
        type: boolean
        default: true
      update_config:
        description: "Overwrite existing mirror.config.json files"
        required: false
        type: boolean
        default: false
      only:
        description: "Optional comma-separated source/mirror filters"
        required: false
        type: string
      skip:
        description: "Optional comma-separated source/mirror filters to skip"
        required: false
        type: string
      include_missing_sources:
        description: "Create mirrors even when the source repository is missing"
        required: false
        type: boolean
        default: false
      manifest:
        description: "Manifest URL or path"
        required: false
        type: string
        default: "https://innioasis.app/slidia_manifest.xml"
      org:
        description: "Organisation that will own the mirrors"
        required: false
        type: string
        default: "y1-community"

permissions:
  contents: write

concurrency:
  group: firmware-mirror-onboarding
  cancel-in-progress: false

jobs:
  onboard:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the packager
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # The repository's default GITHUB_TOKEN policy is read-only.  The
          # token used for onboarding already has contents write and is the
          # credential that commits the watch state and mirror workflows.
          token: ${{ secrets.MIRROR_TOKEN || github.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test the packager
        run: python -m unittest discover -s tests -v

      - name: Plan or apply mirror onboarding
        env:
          GH_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          APPLY: ${{ github.event_name == 'schedule' || inputs.apply }}
          TRIGGER: ${{ inputs.trigger }}
          TRIGGER_CHANGED: ${{ github.event_name == 'schedule' || inputs.trigger_changed }}
          STATE: .github/mirror-watch-state.json
          UPDATE_CONFIG: ${{ inputs.update_config }}
          ONLY: ${{ inputs.only }}
          SKIP: ${{ inputs.skip }}
          INCLUDE_MISSING_SOURCES: ${{ inputs.include_missing_sources }}
          MANIFEST: ${{ inputs.manifest || 'https://innioasis.app/slidia_manifest.xml' }}
          ORG: ${{ inputs.org || 'y1-community' }}
        run: |
          set -euo pipefail
          args=(--manifest "$MANIFEST" --org "$ORG" --out onboarding-report.json)
          if [ -n "${ONLY:-}" ]; then args+=(--only "$ONLY"); fi
          if [ -n "${SKIP:-}" ]; then args+=(--skip "$SKIP"); fi
          if [ "${INCLUDE_MISSING_SOURCES:-false}" = "true" ]; then args+=(--include-missing-sources); fi
          if [ "${APPLY:-false}" = "true" ]; then args+=(--apply --state "$STATE"); fi
          if [ "${TRIGGER:-false}" = "true" ]; then args+=(--trigger); fi
          if [ "${TRIGGER_CHANGED:-false}" = "true" ]; then args+=(--trigger-changed); fi
          if [ "${UPDATE_CONFIG:-false}" = "true" ]; then args+=(--update-config); fi
          python tools/onboard.py "${args[@]}"

      - name: Persist the mirror watch state
        if: always() && (github.event_name == 'schedule' || inputs.apply)
        run: |
          set -euo pipefail
          state=".github/mirror-watch-state.json"
          if [ ! -f "$state" ]; then
            exit 0
          fi
          git add "$state"
          if git diff --cached --quiet -- "$state"; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update firmware mirror watch state"
          git push || { git pull --rebase --autostash && git push; }

      - name: Upload the onboarding report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-report
          path: |
            onboarding-report.json
            .github/mirror-watch-state.json
          if-no-files-found: ignore
          retention-days: 30
