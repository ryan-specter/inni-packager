name: Onboard y1-community firmware mirrors

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Create missing repositories and seed files"
        required: false
        type: boolean
        default: false
      trigger:
        description: "Dispatch each mirror workflow after seeding"
        required: false
        type: boolean
        default: false
      update_config:
        description: "Overwrite existing mirror.config.json files"
        required: false
        type: boolean
        default: false
      only:
        description: "Optional comma-separated source/mirror filters"
        required: false
        type: string
      skip:
        description: "Optional comma-separated source/mirror filters to skip"
        required: false
        type: string
      include_missing_sources:
        description: "Create mirrors even when the source repository is missing"
        required: false
        type: boolean
        default: false
      manifest:
        description: "Manifest URL or path"
        required: false
        type: string
        default: "https://innioasis.app/slidia_manifest.xml"
      org:
        description: "Organisation that will own the mirrors"
        required: false
        type: string
        default: "y1-community"

permissions:
  contents: read

jobs:
  onboard:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the packager
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test the packager
        run: python -m unittest discover -s tests -v

      - name: Plan or apply mirror onboarding
        env:
          GH_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          APPLY: ${{ inputs.apply }}
          TRIGGER: ${{ inputs.trigger }}
          UPDATE_CONFIG: ${{ inputs.update_config }}
          ONLY: ${{ inputs.only }}
          SKIP: ${{ inputs.skip }}
          INCLUDE_MISSING_SOURCES: ${{ inputs.include_missing_sources }}
          MANIFEST: ${{ inputs.manifest }}
          ORG: ${{ inputs.org }}
        run: |
          set -euo pipefail
          args=(--manifest "$MANIFEST" --org "$ORG" --out onboarding-report.json)
          if [ -n "${ONLY:-}" ]; then args+=(--only "$ONLY"); fi
          if [ -n "${SKIP:-}" ]; then args+=(--skip "$SKIP"); fi
          if [ "${INCLUDE_MISSING_SOURCES:-false}" = "true" ]; then args+=(--include-missing-sources); fi
          if [ "${APPLY:-false}" = "true" ]; then args+=(--apply); fi
          if [ "${TRIGGER:-false}" = "true" ]; then args+=(--trigger); fi
          if [ "${UPDATE_CONFIG:-false}" = "true" ]; then args+=(--update-config); fi
          python tools/onboard.py "${args[@]}"

      - name: Upload the onboarding report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-report
          path: onboarding-report.json
          if-no-files-found: ignore
          retention-days: 30
